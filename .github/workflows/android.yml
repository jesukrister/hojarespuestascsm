# Compila las apps Android (normal y Pro) y las publica en "Releases" del repositorio.
name: App Android (APK)

on:
  push:
    paths:
      - 'index.html'
      - 'pro.html'
      - 'privacidad.html'
      - 'pro/**'
      - 'css/**'
      - 'js/**'
      - 'vendor/**'
      - 'android/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas de la página
        run: npm test

      - name: Copiar la página a la app
        run: |
          # También deja pro.html como página principal de la app Pro (android/app/src/pro/assets).
          node scripts/build-pro.js
          node scripts/build-www.mjs
          npx cap sync android

      # Llave privada de firma: se guarda en los secretos del repositorio
      # (Settings → Secrets and variables → Actions): KEYSTORE_BASE64 y
      # KEYSTORE_PASSWORD. Sin ellos se compila igual (para verificar), pero no
      # se publica nada.
      - name: Llave de firma
        id: llave
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lector-hojas.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/lector-hojas.jks" >> "$GITHUB_ENV"
            echo "firmado=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Falta la llave privada (secretos KEYSTORE_BASE64 y KEYSTORE_PASSWORD): la app se compila sin firmar y no se publica."
            echo "firmado=false" >> "$GITHUB_OUTPUT"
            # Se retira la versión anterior, firmada con la llave pública ya reemplazada.
            gh release delete app-android --yes --cleanup-tag || true
          fi

      - name: Compilar APK y AAB (normal y Pro)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Preparar archivos
        if: steps.llave.outputs.firmado == 'true'
        run: |
          cp android/app/build/outputs/apk/normal/release/app-normal-release.apk LectorHojas.apk
          cp android/app/build/outputs/bundle/normalRelease/app-normal-release.aab LectorHojas-GooglePlay.aab
          cp android/app/build/outputs/apk/pro/release/app-pro-release.apk LectorHojasPro.apk
          cp android/app/build/outputs/bundle/proRelease/app-pro-release.aab LectorHojasPro-GooglePlay.aab
          # La Pro debe llevar su propia página (pro.html) y la normal la suya.
          unzip -p LectorHojasPro.apk assets/public/index.html > "$RUNNER_TEMP/pro-index.html"
          unzip -p LectorHojas.apk assets/public/index.html > "$RUNNER_TEMP/normal-index.html"
          grep -q 'data-edition="pro"' "$RUNNER_TEMP/pro-index.html" || { echo "::error::La app Pro no tiene la página Pro"; exit 1; }
          if grep -q 'data-edition="pro"' "$RUNNER_TEMP/normal-index.html"; then echo "::error::La app normal tiene la página Pro"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: steps.llave.outputs.firmado == 'true'
        with:
          name: LectorHojas-${{ github.run_number }}
          path: |
            LectorHojas.apk
            LectorHojas-GooglePlay.aab
            LectorHojasPro.apk
            LectorHojasPro-GooglePlay.aab

      - name: Publicar en Releases
        if: steps.llave.outputs.firmado == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-android"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" LectorHojas.apk LectorHojas-GooglePlay.aab LectorHojasPro.apk LectorHojasPro-GooglePlay.aab \
            --target "$GITHUB_SHA" \
            --title "App Android · versión 1.0.${{ github.run_number }}" \
            --notes "**LectorHojas.apk**: la app normal, para instalar directamente en un teléfono Android. **LectorHojasPro.apk**: la versión Pro (cursos, libro de notas y respaldo); se instala aparte y puede convivir con la normal. Los archivos **.aab** son los que se suben a Google Play Console (uno por app). Todos firmados con la llave oficial del proyecto. Compilado desde ${GITHUB_REF_NAME} (${GITHUB_SHA::7})." \
            --prerelease
